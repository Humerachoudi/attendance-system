<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Panel | Smart Attendance System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f0ff, #ffffff);
      color: #3a0ca3;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      position: relative;
    }

    .top-curve {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 260px;
      background: linear-gradient(135deg, #6a11cb, #8e2de2);
      clip-path: ellipse(80% 100% at 50% 0%);
      z-index: 0;
    }

    header {
      position: relative;
      background: transparent;
      color: white;
      padding: 25px 0 10px;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 1px;
      z-index: 2;
    }

    .gps-icon {
      position: absolute;
      right: 25px;
      top: 30px;
      cursor: pointer;
      transition: 0.3s;
    }
    .gps-icon svg { height: 26px; width: 26px; fill: white; transition: 0.3s; }
    .gps-icon.active svg { fill: #00c853; transform: scale(1.1); }

    .student-info {
      margin-top: 40px;
      background: #ffffffcc;
      width: 90%;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 4px 25px rgba(106, 17, 203, 0.15);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 1;
    }

    .student-info h2 { color: #5b09b4; margin-bottom: 5px; }
    .student-info p { color: #444; margin-top: 0; font-size: 1rem; font-weight: 500; }

    /* 🔹 Year Buttons */
    .year-buttons {
  display: flex;
  justify-content: space-around;
  margin: 15px 0;       /* smaller space above/below */
  flex-wrap: wrap;
  gap: 8px;             /* slightly tighter spacing */
}

.year-btn {
  flex: 1 1 28%;
  background: linear-gradient(135deg, #6a11cb, #8e2de2);
  color: #fff;
  border: none;
  border-radius: 12px;  /* slightly smaller curve */
  padding: 12px 0;      /* reduced height */
  font-size: 1rem;      /* medium text */
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 4px 10px rgba(106, 17, 203, 0.25);
}
.year-btn:hover {
  background: #5b0eb1;
  transform: scale(1.05);
}


    #subjectContainer {
      margin-top: 20px;
      display: none;
      transition: all 0.4s ease;
    }

    select {
      width: 80%;
      padding: 10px;
      border: 2px solid #6a11cb;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: #fff;
      transition: 0.3s;
    }
    select:focus { border-color: #8e2de2; box-shadow: 0 0 5px #8e2de2; }

    button {
      background: linear-gradient(135deg, #6a11cb, #8e2de2);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 25px;
      margin-top: 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: 0.3s;
      box-shadow: 0 0 10px rgba(106, 17, 203, 0.3);
    }
    button:hover { background: #5b0eb1; transform: scale(1.05); }

    .scanner-box {
      margin: 30px auto;
      width: 90%;
      max-width: 400px;
      height: 260px;
      border: 3px solid #6a11cb;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(106,17,203,0.2);
      position: relative;
      overflow: hidden;
      display: none;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .scan-line {
      position: absolute; top: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(90deg, transparent, #00c853, transparent);
      animation: scanMove 2s linear infinite;
    }
    @keyframes scanMove {
      0% { top: 0; opacity: 0.8; }
      50% { top: 95%; opacity: 0.5; }
      100% { top: 0; opacity: 0.8; }
    }

    .toast {
      display: none; position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%); background: #6a11cb; color: #fff;
      padding: 10px 25px; border-radius: 10px; font-weight: 600;
      z-index: 1000;
    }
    .toast.error { background: #e63946; }

    .success-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.95); display: none; justify-content: center;
      align-items: center; flex-direction: column; z-index: 1000;
      text-align: center;
    }
    .checkmark {
      width: 100px; height: 100px; border-radius: 50%;
      display: inline-block; border: 4px solid #28a745;
      position: relative; animation: popIn 0.3s ease-out;
    }
    .checkmark::after {
      content: ""; position: absolute; left: 25px; top: 50px;
      width: 25px; height: 50px; border-right: 5px solid #28a745;
      border-bottom: 5px solid #28a745; transform: rotate(45deg);
      animation: drawCheck 0.4s ease forwards;
    }
    @keyframes popIn { 0%{transform:scale(0.5);opacity:0;}100%{transform:scale(1);opacity:1;} }
    @keyframes drawCheck { from{height:0;width:0;} to{height:50px;width:25px;} }

    .success-text { font-size:1.2rem;font-weight:600;color:#28a745;margin-top:15px; }

    .back-btn {
  position: fixed;
  top: 22px;
  left: 22px;
  background: linear-gradient(135deg, #7b2ff7, #a93b84); /* vibrant purple-pink gradient */
  color: #fff;
  border: 2px solid rgba(255,255,255,0.25); /* adds subtle outline */
  border-radius: 30px; /* soft pill shape */
  padding: 10px 22px;
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(123, 47, 247, 0.4); /* glowing shadow */
  transition: all 0.3s ease;
  z-index: 10;
}

.back-btn:hover {
  background: linear-gradient(135deg, #8e2de2, #4a00e0); /* deeper purple */
  transform: scale(1.07);
  box-shadow: 0 6px 18px rgba(78, 0, 224, 0.45);
}



    #activeSubjectBox {
      margin-top: 15px; font-size: 1rem; font-weight: 600; color: #6a11cb;
      background: #f3e8ff; padding: 10px 12px;
      border-radius: 8px; border: 2px solid #8e2de2;
      width: 80%; margin-left: auto; margin-right: auto;
    }
    #activeSubjectName.inactive { color: #555; }


    /* ===== Mobile-Friendly Styles ===== */
@media (max-width: 768px) {
  header {
    font-size: 1.2rem;
    padding: 20px 10px 8px;
  }

  .gps-icon {
    right: 15px;
    top: 25px;
    svg { height: 22px; width: 22px; }
  }

  .student-info {
    width: 95%;
    padding: 20px 15px;
    margin-top: 30px;
  }

  .student-info h2 {
    font-size: 1.3rem;
  }
  .student-info p {
    font-size: 0.9rem;
  }

  .year-buttons {
    flex-direction: column;
    gap: 10px;
  }

  .year-btn {
    flex: 1 1 100%;
    font-size: 0.9rem;
    padding: 10px 0;
  }

  select {
    width: 95%;
    font-size: 0.9rem;
    padding: 8px;
  }

  button {
    width: 95%;
    font-size: 0.9rem;
    padding: 10px;
  }

  .scanner-box {
    width: 95%;
    height: 200px;
  }

  #activeSubjectBox {
    width: 95%;
    font-size: 0.9rem;
    padding: 8px 10px;
  }

  .back-btn {
    top: 15px;
    left: 15px;
    padding: 8px 18px;
    font-size: 0.85rem;
  }

  .success-text {
    font-size: 1rem;
  }
}

  </style>
</head>
<body>
  <div class="top-curve"></div>

  <header>
    🎓 Smart Attendance System
    <span class="gps-icon" id="gpsIcon" title="Get Location" onclick="getLiveLocation()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
        <path d="M168 0C75.6 0 0 75.6 0 168c0 87.4 144 312 168 344 24-32 168-256.6 168-344C336 75.6 260.4 0 168 0zm0 240a72 72 0 1 1 0-144 72 72 0 1 1 0 144z"/>
      </svg>
    </span>
  </header>

  <div class="student-info">
    <h2>Welcome, {{ name }} 👋</h2>
    <p><b>Register No:</b> {{ reg_number }}</p>

    <h3>Select Year:</h3>
    <div class="year-buttons">
      <button class="year-btn" onclick="toggleYear(1)">1st Year</button>
      <button class="year-btn" onclick="toggleYear(2)">2nd Year</button>
      <button class="year-btn" onclick="toggleYear(3)">3rd Year</button>
    </div>

    <div id="subjectContainer">
      <label for="subject">Select Subject:</label><br>
      <select id="subject"></select>
      <div id="activeSubjectBox">
        <span id="activeSubjectName">Checking attendance status...</span>
      </div>
      <button onclick="startCamera()">Start Scanner</button>
    </div>
  </div>

  <div class="scanner-box" id="scannerBox">
    <video id="video" autoplay playsinline></video>
    <div class="scan-line"></div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="successOverlay" class="success-overlay">
    <div class="checkmark"></div>
    <div class="success-text" id="successText"></div>
  </div>
  <button type="button" class="back-btn" onclick="goBack()">⬅ Back to Login</button>

  <script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>
  <script>
    const video = document.getElementById('video');
    const toast = document.getElementById('toast');
    const scannerBox = document.getElementById('scannerBox');
    const successOverlay = document.getElementById('successOverlay');
    const successText = document.getElementById('successText');
    const activeName = document.getElementById('activeSubjectName');
    const gpsIcon = document.getElementById('gpsIcon');
    const studentId = "{{ student_id }}";
    const studentName = "{{ name }}";
    let lastQR = null, scanning = false, selectedSubject = "", stream = null;
    let liveLat = null, liveLon = null;
    let currentYear = null;

    const yearSubjects = {
      1: ["English", "C Language", "C Programming Lab", "Information Technology", "IT Lab", "Indian Constitution", "Kannada/Functional" ,"Mathematics","Accountancy"],
      2: ["Database Management System", "DBMS lab", "Computer Networking", "Digital Marketing", "C-Sharp C#", "C# lab","English","Kannada"],
      3: ["R Programming", "Design And Analysis of Algorithm", "DAA lab", "R  Progrmming lab", "Cloud Computing","Cyber Security","Software Engineering","Digital Marketing"]
    };

    function toggleYear(year) {
      const select = document.getElementById("subject");
      const container = document.getElementById("subjectContainer");
      if (currentYear === year && container.style.display === "block") {
        container.style.display = "none";
        currentYear = null;
        return;
      }
      currentYear = year;
      select.innerHTML = `<option value="">-- Choose Subject --</option>`;
      yearSubjects[year].forEach(sub => {
        const opt = document.createElement("option");
        opt.value = sub;
        opt.textContent = sub;
        select.appendChild(opt);
      });
      container.style.display = "block";
    }

    setInterval(checkActiveSubject, 10000);
    checkActiveSubject();

    async function checkActiveSubject() {
      try {
        const res = await fetch('/api/active_attendance');
        const data = await res.json();
        if (data.success && data.active_subjects.length > 0) {
          const active = data.active_subjects[0];
          activeName.textContent = `Active Attendance: ${active.subject}`;
          activeName.classList.remove("inactive");
        } else {
          activeName.textContent = "No attendance session available right now.";
          activeName.classList.add("inactive");
        }
      } catch {
        activeName.textContent = "Unable to check attendance status.";
      }
    }

    function getLiveLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            liveLat = pos.coords.latitude;
            liveLon = pos.coords.longitude;
            gpsIcon.classList.add("active");
            showToast("✅ GPS location captured");
          },
          () => showToast("⚠️ Please allow GPS permission", false)
        );
      } else showToast("❌ Geolocation not supported", false);
    }

    function playBeep() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = 880;
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + 0.15);
    }

    function showToast(message, success = true) {
      toast.textContent = message;
      toast.className = `toast ${success ? '' : 'error'}`;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 4000);
    }

    async function startCamera() {
      selectedSubject = document.getElementById("subject").value;
      if (!selectedSubject) return showToast("Please select a subject first.", false);
      if (!liveLat || !liveLon) return showToast("Please click 📍 to allow GPS first.", false);

      scannerBox.style.display = "block";
      scanning = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          requestAnimationFrame(scanFrame);
        };
      } catch {
        showToast("Camera not accessible.", false);
      }
    }

    function scanFrame() {
      if (!scanning || video.readyState !== video.HAVE_ENOUGH_DATA) {
        requestAnimationFrame(scanFrame);
        return;
      }
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, canvas.width, canvas.height);
      if (code) {
        const qrText = code.data.trim();
        if (qrText && qrText !== lastQR) {
          lastQR = qrText;
          submitQR(qrText, selectedSubject);
        }
      }
      requestAnimationFrame(scanFrame);
    }

    function submitQR(qrText, subject) {
      fetch(`/api/scan_qr/${studentId}`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ qr_text: qrText, subject, latitude: liveLat, longitude: liveLon })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            playBeep();
            showSuccess(`✅ ${studentName} marked present for ${subject}<br>
              <a href='https://www.google.com/maps?q=${liveLat},${liveLon}' target='_blank'>
              View Location</a>`);
            scanning = false;
            stopCamera();
          } else showToast(data.message || "❌ Invalid QR", false);
        })
        .catch(() => showToast("Network error", false));
    }

    function stopCamera() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      scannerBox.style.display = "none";
      scanning = false;
    }

    function showSuccess(message) {
      successText.innerHTML = message;
      successOverlay.style.display = "flex";
      setTimeout(() => successOverlay.style.display = "none", 6000);
    }

    function goBack() { window.location.href = "/"; }
  </script>
</body>
</html>
