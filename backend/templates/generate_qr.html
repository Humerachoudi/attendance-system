<!DOCTYPE html>
<html>
<head>
  <title>QR Code</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 40px; }
    img { width: 300px; height: 300px; margin-top: 20px; }
    a { text-decoration: none; background: #007bff; color: white; padding: 10px 15px; border-radius: 5px; }

    /* ===== Mobile Adjustment ===== */
body {
  font-family: 'Poppins', sans-serif;
  text-align: center;
  margin: 20px;
}

h2 {
  font-size: 1.4rem;
  margin-bottom: 10px;
}

p {
  font-size: 1rem;
  margin-bottom: 15px;
  word-wrap: break-word;
}

img {
  width: 90%;
  max-width: 300px;
  height: auto;
  margin: 15px 0;
  border-radius: 12px;
}

a {
  display: inline-block;
  margin-top: 15px;
  text-decoration: none;
  background: linear-gradient(135deg, #6a11cb, #8e2de2);
  color: white;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  transition: 0.3s;
}

a:hover {
  background: #5b0eb1;
  transform: scale(1.05);
}

  </style>
</head>
<body>
  <h2>QR Code for {{ today }}</h2>
  <p>QR Content: {{ qr_text }}</p>
  <img src="{{ qr_path }}" alt="QR Code">
  <div><a href="/teacher_panel">⬅ Back</a></div>
</body>
</html>
