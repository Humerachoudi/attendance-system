<!DOCTYPE html>
<html>
<head>
<title>Scan QR</title>
<style>

  /* ===== Mobile-Friendly Styles ===== */
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  padding: 0;
  text-align: center;
}

h2 {
  font-size: 1.5rem;
  margin: 20px 0;
}

#reader {
  width: 90% !important;
  max-width: 350px;
  margin: 20px auto;
  border-radius: 12px;
  overflow: hidden;
}

#status {
  font-size: 1rem;
  margin-top: 15px;
  color: #6a11cb;
}

/* Buttons or feedback (if added later) */
button {
  width: 90%;
  max-width: 300px;
  padding: 10px 15px;
  font-size: 1rem;
  margin-top: 15px;
  border-radius: 10px;
  background: linear-gradient(135deg, #6a11cb, #8e2de2);
  color: #fff;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #5b0eb1;
}

</style>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<h2>Scan QR Code</h2>
<div id="reader" style="width:300px;margin:auto;"></div>
<div id="status">Waiting...</div>
<script>
function markAttendance(student_id){
  fetch("/mark_attendance/",{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:`student_id=${student_id}`
  }).then(res=>res.json())
    .then(data=>{document.getElementById("status").innerHTML="✅ Attendance marked!";});
}
function onScanSuccess(decodedText){
  document.getElementById("status").innerHTML=`Scanned: ${decodedText}`;
  markAttendance(decodedText);
}
const html5QrCode = new Html5Qrcode("reader");
Html5Qrcode.getCameras().then(cameras=>{
  if(cameras && cameras.length){html5QrCode.start(cameras[0].id,{fps:10,qrbox:250},onScanSuccess);}
  else{document.getElementById("status").innerHTML="❌ No camera found!";}
});
</script>
</body>
</html>
